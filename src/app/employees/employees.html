<div class="theme-container" [class.dark]="colorMode()" [class.light]="!colorMode()">
  <h2>Employee Details</h2>
  <div class="employee-row">
    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Role</th>
          <th>Email</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        @for(emp of employees();track emp.id){
          <tr>
            <td>{{emp.id}}</td>
            <td>{{emp.firstName}} {{emp.lastName}}</td>
            <td>{{emp.designation}}</td>
            <td>{{emp.email}}</td>
            <td><button type="button" (click)="editEmployee(emp)">Edit</button></td>
            <td><button type="button" (click)="deleteEmployee(emp)">Delete</button></td>
          </tr>
        }
      </tbody>
    </table>
      <!-- <span>
        {{emp.id}}
        {{emp.firstName}}
        {{emp.lastName}}
        - {{emp.designation}}
        - {{emp.email}}
      </span>
      <button type="button" (click)="editEmployee(emp)">Edit</button>
      <button type="button" (click)="deleteEmployee(emp)">Delete</button> -->
  </div>
  <br>
  <button type="button" (click)="addEmployee()">Add Employee</button>
  @if(showPopup()){
    <div class="popup">
      <form [formGroup]="employeeForm">
        <input type="text" formControlName="employeeCode" placeholder="Employee Code">
        <br>
        <!-- personal Information -->

        <input type="text" formControlName="firstName" placeholder="First Name">
        <br>
        <input type="text" formControlName="lastName" placeholder="Last Name">
        <br>
        <input type="date" formControlName="dateOfBirth" placeholder="Date Of Birth">
        <br>
        <select name="gender" id="gender" aria-label="Select your gender" formControlName="gender">
          <option [ngValue]="null" disabled>Select Your Gender</option>
          @for(gender of genders;track gender){
            <option [value]="gender">{{ gender }}</option>
          }
        </select>
        <br>
        <select name="maritalStatus" id="marital-status" aria-label="Select your marital status" formControlName="maritalStatus">
          <option [ngValue]="null" disabled>Select Your Marital Status</option>
          @for(type of maritalStatuses;track type){
            <option [value]="type">{{ type }}</option>
          }
        </select>
        <br>
        <select name="bloodGroup" id="blood-group" aria-label="Select your blood group" formControlName="bloodGroup">
          <option [ngValue]="null" disabled>Select Your Blood Group</option>
          @for(type of bloodGroups;track type){
            <option [value]="type">{{ type }}</option>
          }
        </select>
        <br>
        <input type="text" formControlName="profilePhoto" placeholder="Profile Picture">
        <br>

        <!-- contact Information -->


        <input type="email" formControlName="email" placeholder="Email">
        <br>
        <input type="tel" formControlName="phone" placeholder="Phone Number">
        <br>
        <input type="tel" formControlName="emergencyContact" placeholder="Emergency Contact Number">
        <br>
        <input type="text" formControlName="address" placeholder="Address">
        <br>
        <input type="text" formControlName="city" placeholder="City">
        <br>
        <input type="text" formControlName="state" placeholder="State">
        <br>
        <input type="text" formControlName="pincode" placeholder="Pincode">
        <br>

        <!-- proffesional Information -->
        <select name="department" id="selectedDepartment" aria-label="Department" formControlName="departmentId">
          <option [ngValue]="null" disabled>Select Department</option>
          @for(dept of departments();track dept.id){
            <option [value]="dept.id">{{dept.name}}</option>
          }
        </select>
        <br>
        <input type="text" formControlName="designation" placeholder="Designation">
        <br>
        <!-- manager dropdown -->
        <select name="Manager" id="ManagerSelection" formControlName="managerId" aria-label="manager">
          <option [ngValue]="null" disabled>Select Your Manager</option>
          @for(manager of employees();track manager.id){
            @if(manager.id!=editingEmployee()?.id){
            <option [value]="manager.id">{{manager.firstName}} {{manager.lastName}}</option>
            }
          }
        </select>
        <br>
        <input type="date" formControlName="joiningDate" placeholder="Joining Date">
        <br>
        <input type="text" formControlName="employmentType" placeholder="Employment Type">
        <br>
        <input type="number" formControlName="salary" placeholder="Salary">
        <br>
        <select name="shift" id="shift" aria-label="Work Shift" formControlName="shift">
          <option [ngValue]="null" disabled>Select Work Shift</option>
          @for(shift of shifts;track shift){
            <option [value]="shift">{{shift}}</option>
          }
        </select>
        <br>
        <select name="workLocation" id="workLocation" aria-label="Work Location" formControlName="workLocation">
          <option [ngValue]="null"disabled>Select Work Location</option>
          @for(location of workLocations;track location){
            <option [value]="location">{{location}}</option>
          }
        </select>
        <br>
        <button type="button" (click)="saveEmployee()">
          save
        </button>
      </form>
    </div>
  }

  <mat-slide-toggle [checked]="colorMode()" (change)="toggleChange($event)"
    [style.color]="colorMode() ? 'black' : 'white'">
    <span [style.color]="colorMode() ? 'white':'black'">
      {{ colorMode() ? 'Light' : 'Dark' }} Theme
    </span>
  </mat-slide-toggle>
</div>
